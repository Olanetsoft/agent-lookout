name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per check, so a failure names itself.
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The layout check uses nothing but Node, so nothing is installed.
      - run: npm run check:layout

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the development line and holds the oldest version the package supports, 22.12. 24 is the LTS line after it.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Component tests run in real Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # The unit, integration and component tests on Windows. A test of something
  # Windows does not have, such as a POSIX sh script, a Unix socket, ps, tmux,
  # osascript or a POSIX signal, is skipped there and says why.
  test-windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Component tests run in real Chromium.
      - run: npx playwright install chromium
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bundles the Mac app's main process, which stops if it would need a
      # package at run time. Packing the app itself needs a Mac, so it is not
      # done here, and nothing here downloads Electron: since Electron 44 the
      # binary comes only when something runs it, and no job does.
      - run: node scripts/build-desktop.mjs

  # Starts the built app on Linux with `npm start`, as a person would, on
  # folders of its own, and checks that it reads Claude Code, Codex and status
  # files and lists their sessions with the right statuses, then stops it.
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run start:check

  # The same on Windows: the built app started with `npm start`, on folders of
  # its own, then ended with every process under it.
  start-windows:
    name: start (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run start:check

  # Checks the package as a person gets it from npm. `npm pack` runs prepack,
  # which builds the dashboard and bundles the command into dist/cli/. The
  # tarball must hold only what the package needs, and it and the install must
  # stay within the size limits in scripts/package-size.mjs. It is installed
  # into a folder of its own, with nothing from this checkout, and started
  # there with `npx --yes=false agent-lookout`, which never installs the
  # published package in its place, on folders of the check's own. Then it is
  # stopped as Ctrl+C would stop it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: The tarball holds only what the package needs
        run: |
          tar -tzf "$RUNNER_TEMP"/agent-lookout-*.tgz | sort | tee "$RUNNER_TEMP/files.txt"
          if grep -Ev '^package/(bin/agent-lookout\.mjs|dist/.+|docs/(API|GUIDE)\.md|(CHANGELOG|DISCLAIMER|PRIVACY|README|SECURITY)\.md|LICENSE|package\.json)$' "$RUNNER_TEMP/files.txt"; then
            echo "The lines above should not be in the package."
            exit 1
          fi
          if grep -E '\.map$' "$RUNNER_TEMP/files.txt"; then
            echo "The package holds a source map."
            exit 1
          fi
          if grep -E '\.woff$' "$RUNNER_TEMP/files.txt"; then
            echo "The package holds a .woff font. The dashboard needs only the .woff2 files."
            exit 1
          fi
          for file in LICENSE dist/THIRD-PARTY-LICENSES.md; do
            if [ "$(tar -xzOf "$RUNNER_TEMP"/agent-lookout-*.tgz "package/$file" | wc -c)" -eq 0 ]; then
              echo "package/$file is missing or empty."
              exit 1
            fi
          done
      - name: Install it into a folder of its own
        run: |
          mkdir "$RUNNER_TEMP/try"
          cd "$RUNNER_TEMP/try"
          # A package.json of its own, so npm installs here and not into a folder above.
          echo '{ "private": true }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/agent-lookout-*.tgz
          test ! -e node_modules/agent-lookout/src
      # Prints the sizes of the tarball, its files and the install, and fails
      # when one has grown past its limit in scripts/package-size.mjs.
      - name: The package is no bigger than its limits
        run: node "$GITHUB_WORKSPACE/scripts/package-size.mjs" "$RUNNER_TEMP"/agent-lookout-*.tgz "$RUNNER_TEMP/try"
      - run: npx --yes=false agent-lookout --help
        working-directory: ${{ runner.temp }}/try
      # The bundle in dist/cli/ reads the version from the package.json two folders up.
      - name: Version is the package's
        working-directory: ${{ runner.temp }}/try
        run: |
          expected=$(node -p 'require("./node_modules/agent-lookout/package.json").version')
          said=$(npx --yes=false agent-lookout --version)
          echo "$said"
          test "$said" = "$expected" && test "$(npx --yes=false agent-lookout -v)" = "$expected"
      - run: node "$GITHUB_WORKSPACE/scripts/start-check.mjs" --command npx --yes=false agent-lookout
        working-directory: ${{ runner.temp }}/try
      # With nothing running, status says so in one line, names the command
      # this package installs as the way to start it, and exits with 2.
      - name: Status says how to start it
        working-directory: ${{ runner.temp }}/try
        run: |
          set +e
          said=$(npx --yes=false agent-lookout status 2>&1)
          code=$?
          echo "$said"
          test "$code" -eq 2 && grep -q "Start it with npx agent-lookout, agent-lookout," <<< "$said"
