name: Mac app release

# Builds the Mac app for a release and attaches it to that release on GitHub:
# a disk image and a zip for Apple silicon and for Intel, and latest-mac.yml,
# which gives each file's size and SHA-512. The app checks the latest release's
# latest-mac.yml for a newer version, and checks what it downloads against it.
#
# The maintainer pushes the tag, v and the version in package.json, such as
# v0.2.1. This runs for it, and can be run again by hand for a tag already
# pushed. It makes the release as a draft when there is none yet, and replaces
# files of the same name when there is. It publishes nothing to npm and does
# not publish a draft: the maintainer does that.
#
# Two jobs, so the token that can change a release is never in reach of the
# dependencies' install scripts, the tests or the build. The first builds with
# read access only and hands the five files on as an artifact. The second, the
# only one that can write, downloads them and runs gh, and nothing else.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release, such as v0.2.1, already pushed
        required: true
        type: string

# One run for a tag at a time. A second waits for the first, rather than racing it to the release.
concurrency:
  group: release-mac-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Nothing, unless a job says otherwise.
permissions: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Read from here in every step, never written into a script.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: The tag is v and a version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The tag $TAG is not v followed by a version such as 0.2.1."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # No cache: what builds a release is installed afresh.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The tag is the version in package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG, and package.json says $version. Set the version, commit, and tag that commit v$version."
            exit 1
          fi

      - run: npm ci
      # The checks that say something about this Mac build. The component tests
      # are left to CI, which runs every one on Linux for the same commit before
      # a tag is pushed: on GitHub's Mac runners Chromium reports reduced motion
      # and measures fonts a fraction of a pixel differently, so the tests of
      # motion and pixel sizes there would fail a release that is sound.
      - run: npm run check:layout
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Includes the tests that unpack real zips with ditto, which only run on a Mac.
      - run: npm run test:integration

      # Signed ad hoc, as electron-builder.ts says, and published nowhere:
      # --publish never, and its update provider is one it never uploads to.
      - name: Build the app
        run: npm run dist:mac

      - name: The files are there, for this version
        run: |
          version="${TAG#v}"
          for file in \
            "release/Agent-Lookout-$version-mac-arm64.dmg" \
            "release/Agent-Lookout-$version-mac-x64.dmg" \
            "release/Agent-Lookout-$version-mac-arm64.zip" \
            "release/Agent-Lookout-$version-mac-x64.zip" \
            release/latest-mac.yml; do
            test -s "$file" || { echo "$file was not built."; exit 1; }
          done
          cat release/latest-mac.yml
          grep -qx "version: $version" release/latest-mac.yml || {
            echo "latest-mac.yml does not give version $version."
            exit 1
          }

      # The dmgs and zips are compressed already.
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Attaching files to a release needs this, and nothing more.
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mac-app
          path: release

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" \
              --notes "The Mac app for $TAG is attached. Write the notes for this version, then publish the release."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release/Agent-Lookout-$version-mac-arm64.dmg" \
            "release/Agent-Lookout-$version-mac-x64.dmg" \
            "release/Agent-Lookout-$version-mac-arm64.zip" \
            "release/Agent-Lookout-$version-mac-x64.zip" \
            release/latest-mac.yml
